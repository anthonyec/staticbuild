<style>
  * {
    transform-origin: center;
  }

  h1 {
    color: red
  }
</style>

<script>
  const h1 = document.querySelector("h1")
  h1.addEventListener("click", () => h1.setAttribute("style", "transform: rotate(3deg)"))
</script>

<script>
  const img = document.querySelector("img")
  img.addEventListener("click", () => img.setAttribute("style", "transform: rotate(-3deg)"))
</script>
